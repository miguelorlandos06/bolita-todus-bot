name: ToDus Bolita Bot

on:
  schedule:
    - cron: '0 */5 * * *' # Se ejecuta cada 5 horas
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 310 # 5 horas y 10 minutos de margen
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancelar ejecuciones anteriores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Buscando runs antiguos en progreso..."
          # Obtiene los IDs de los runs en progreso/espera y los cancela (ignorando el actual)
          gh run list --workflow=bot.yml --status in_progress --json databaseId -q '.[].databaseId' | xargs -I {} gh run cancel {} || true
          gh run list --workflow=bot.yml --status queued --json databaseId -q '.[].databaseId' | xargs -I {} gh run cancel {} || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TODUS_TOKEN: ${{ secrets.TODUS_TOKEN }}
        run: python bot_todus.py
